name: .NET Build/Test/Pack/Push
author: Alex Vincent
description: Performs steps required to push a versioned NuGet package to the official NuGet and/or GitHub packages feeds.

inputs:
  checkout:
    type: boolean
    description: Checkout the current repository?
    default: true
  #Empty checks out the triggering ref. Set to a tag or SHA to rebuild and re-publish an older
  #version; the push gates still evaluate github.ref, i.e. the branch the workflow ran from.
  checkout-ref:
    type: string
    description: Git ref to checkout e.g. v1.2.3 or a commit SHA
    default: ''
  version:
    type: string
    description: NuGet package version e.g. 1.2.301-feature-my-feature.12
    required: true
  GITHUB_TOKEN:
    description: GitHub token to push to GitHub packages e.g. secrets.GITHUB_TOKEN
    type: string
  #DEPRECATED, superseded by nuget-user (Trusted Publishing). Ignored when nuget-user is set.
  NUGET_API_KEY:
    description: Long-lived NuGet API key e.g. secrets.NUGET_API_KEY
    type: string
  #When set, an OIDC token is exchanged for a short-lived nuget.org API key in place of
  #NUGET_API_KEY. The calling job must declare permissions with id-token write.
  nuget-user:
    type: string
    description: nuget.org profile username of the Trusted Publishing policy creator
    default: ''
  configuration:
    type: string
    description: .NET Configuration e.g. Debug or Release
    default: Release
  #Empty targets whatever solution/project lives in the working directory. Under Microsoft.Testing.Platform
  #mode 'dotnet test' rejects a positional path, so the value must then resolve to a .sln, .slnx or .csproj.
  solution-name:
    type: string
    description: .NET solution or project to build e.g. MySolution.slnx or MyProject.csproj
    default: ''
  push:
    type: boolean
    description: Should we push packages?
    default: true
  push-preview:
    description: Push a pre-release NuGet package from a non-default branch? The version's SemVer pre-release suffix (e.g. 1.2.3-my-feature.4) signals preview status to NuGet.
    type: boolean
    default: false
  execute-tests:
    description: Execute unit tests. Default is 'true'
    type: boolean
    default: true
  code-coverage:
    description: Execute code coverage tools. Default is 'true'
    type: boolean
    default: true
  dotnet-restore-args:
    type: string
    description: Optional 'dotnet restore' arguments.
    default: ''
  dotnet-build-args:
    type: string
    description: Optional 'dotnet build' arguments.
    default: ''
  dotnet-test-args:
    type: string
    description: Optional 'dotnet test' arguments.
    default: ''
  dotnet-pack-args:
    type: string
    description: Optional 'dotnet pack' arguments.
    default: ''
  dotnet-push-args:
    type: string
    description: Optional 'dotnet push' arguments.
    default: ''
  package-filter:
    type: string
    description: Comma-separated list of package ID prefixes to push e.g. 'CasCap.Common.Caching,CasCap.Common.Extensions'. When empty all packages are pushed.
    default: ''

outputs:
  configuration:
    description: .NET Configuration e.g. Debug or Release
    value: ${{ steps.setvars.outputs.configuration }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      if: inputs.checkout == 'true'
      with:
        fetch-depth: 0
        ref: ${{ inputs.checkout-ref }}

    - name: set vars
      shell: bash
      id: setvars
      run: |
        configuration="${{ inputs.configuration }}"
        echo "configuration=${configuration:-"Release"}" >> $GITHUB_OUTPUT

    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: dotnet restore
      shell: bash
      run: dotnet restore ${{ inputs.solution-name }} --verbosity minimal ${{ inputs.dotnet-restore-args }}
      env:
        #https://github.com/NuGet/Home/issues/7575#issuecomment-443801131
        NUGET_RESTORE_MSBUILD_ARGS: /p:Configuration=${{ steps.setvars.outputs.configuration }}

    - name: dotnet build
      shell: bash
      run: dotnet build ${{ inputs.solution-name }} -c ${{ steps.setvars.outputs.configuration }} --no-restore --nologo -p:Version='${{ inputs.version }}' -p:SourceRevisionId=${{ github.sha }} ${{ inputs.dotnet-build-args }}

    - name: dotnet test
      if: inputs.execute-tests == 'true'
      shell: bash
      env:
        CONFIGURATION: ${{ steps.setvars.outputs.configuration }}
        SOLUTION_NAME: ${{ inputs.solution-name }}
        DOTNET_TEST_ARGS: ${{ inputs.dotnet-test-args }}
      run: "${{ github.action_path }}/.scripts/dotnet-test.sh"

    #Microsoft.Testing.Platform emits cobertura and coverlet (VSTest mode) emits lcov, coveralls consumes
    #lcov, so ReportGenerator is pointed at both formats and normalises whichever one is present.
    - name: code coverage - report generator
      if: inputs.execute-tests == 'true' && inputs.code-coverage == 'true'
      uses: danielpalme/ReportGenerator-GitHub-Action@v5
      with:
        #cobertura comes from MTP mode, lcov from coverlet in VSTest mode. The bare '**.info'
        #spelling is the one this action shipped for years, so it is kept alongside '**/*.info'.
        reports: ${{ github.workspace }}/coverage/**/*.cobertura.xml;${{ github.workspace }}/coverage/**.info;${{ github.workspace }}/coverage/**/*.info
        targetdir: ${{ github.workspace }}/coveragereport
        reporttypes: lcov
        tag: ${{ github.run_number }}_${{ github.run_id }}

    - name: code coverage - coveralls (1 of 2)
      shell: bash
      if: inputs.execute-tests == 'true' && inputs.code-coverage == 'true'
      id: coveralls
      run: |
        files=$(find ${{ github.workspace }}/coveragereport -type f -name '*.info' -printf '%p ')
        echo "files=$files" >> $GITHUB_OUTPUT

    - name: code coverage - coveralls (2 of 2)
      if: inputs.execute-tests == 'true' && inputs.code-coverage == 'true'
      uses: coverallsapp/github-action@v2
      with:
        files: ${{ steps.coveralls.outputs.files }}

    - name: code coverage - upload-artifact
      if: inputs.execute-tests == 'true' && inputs.code-coverage == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: coveragereport
        path: coveragereport

    - name: dotnet pack
      shell: bash
      run: dotnet pack ${{ inputs.solution-name }} -c ${{ steps.setvars.outputs.configuration }} --nologo --no-build --include-symbols -p:Version='${{ inputs.version }}' ${{ inputs.dotnet-pack-args }}
      if: |
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
          || inputs.push-preview == 'true'

    - name: resolve .nupkg files to push
      shell: bash
      id: packages
      if: |
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
          || inputs.push-preview == 'true'
      run: |
        shopt -s globstar nullglob
        all_packages=(${{ github.workspace }}/src/**/*.nupkg)
        if [[ -n "${{ inputs.package-filter }}" ]]; then
          IFS=',' read -ra FILTERS <<< "${{ inputs.package-filter }}"
          matched=()
          for pkg in "${all_packages[@]}"; do
            name=$(basename "$pkg")
            for filter in "${FILTERS[@]}"; do
              filter=$(echo "$filter" | xargs)
              if [[ "$name" == ${filter}.* ]]; then
                matched+=("$pkg")
                break
              fi
            done
          done
          packages=("${matched[@]}")
        else
          packages=("${all_packages[@]}")
        fi
        if [[ ${#packages[@]} -eq 0 ]]; then
          echo "::warning::No .nupkg files matched the package filter '${{ inputs.package-filter }}'"
        else
          echo "Packages to push:"
          printf '  %s\n' "${packages[@]}"
        fi
        printf '%s\n' "${packages[@]}" > "${{ runner.temp }}/nupkg-list.txt"
        echo "count=${#packages[@]}" >> $GITHUB_OUTPUT

    - name: nuget trusted publishing (1 of 2) - preflight
      shell: bash
      if: |
        inputs.nuget-user != ''
          && steps.packages.outputs.count > 0
          && ((inputs.push == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
            || inputs.push-preview == 'true')
      run: "${{ github.action_path }}/.scripts/nuget-trusted-publishing-preflight.sh"

    - name: nuget trusted publishing (2 of 2) - exchange oidc token for api key
      shell: bash
      if: |
        inputs.nuget-user != ''
          && steps.packages.outputs.count > 0
          && ((inputs.push == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
            || inputs.push-preview == 'true')
      env:
        NUGET_USER: ${{ inputs.nuget-user }}
        NUGET_AUDIENCE: https://www.nuget.org
        NUGET_TOKEN_ENDPOINT: https://www.nuget.org/api/v2/token
      run: "${{ github.action_path }}/.scripts/nuget-trusted-publishing-exchange.sh"

    - name: dotnet push (api.nuget.org)
      shell: bash
      env:
        #NUGETORG_API_KEY is exported to $GITHUB_ENV by the trusted publishing step; NUGET_API_KEY is the deprecated fallback.
        NUGET_LEGACY_API_KEY: ${{ inputs.NUGET_API_KEY }}
      run: |
        set -euo pipefail
        api_key="${NUGETORG_API_KEY:-$NUGET_LEGACY_API_KEY}"
        if [[ -z "$api_key" ]]; then
          echo "::warning title=nuget.org::No nuget.org credential available (set nuget-user for Trusted Publishing, or NUGET_API_KEY), skipping push to api.nuget.org"
          exit 0
        fi
        while IFS= read -r pkg; do
          [[ -z "$pkg" ]] && continue
          dotnet nuget push "$pkg" --skip-duplicate --api-key "$api_key" --source https://api.nuget.org/v3/index.json ${{ inputs.dotnet-push-args }}
        done < "${{ runner.temp }}/nupkg-list.txt"
      if: |
        steps.packages.outputs.count > 0
          && ((inputs.push == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
            || inputs.push-preview == 'true')

    - name: dotnet push (nuget.pkg.github.com)
      shell: bash
      run: |
        if [[ -n "${{ inputs.GITHUB_TOKEN }}" ]]; then
          #Note: GitHub Packages is not a full NuGet feed so for advanced NuGet functions the gpr tool (https://github.com/jcansdale/gpr) may be needed instead.
          while IFS= read -r pkg; do
            [[ -z "$pkg" ]] && continue
            dotnet nuget push "$pkg" --skip-duplicate -k ${{ inputs.GITHUB_TOKEN }} -s https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json ${{ inputs.dotnet-push-args }}
          done < "${{ runner.temp }}/nupkg-list.txt"
        else
          echo "::warning title=GITHUB_TOKEN::GITHUB_TOKEN is missing from secrets, skipping push to nuget.pkg.github.com"
        fi
      if: |
        steps.packages.outputs.count > 0
          && inputs.push == 'true'
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
