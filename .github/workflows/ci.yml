name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    uses: f2calv/gha-workflows/.github/workflows/lint.yml@v1
    permissions:
      contents: read

  versioning:
    uses: f2calv/gha-workflows/.github/workflows/gha-release-versioning.yml@v1
    with:
      tag-and-release: false
    permissions:
      contents: read

  #Runs the Action from this commit against tests/fixtures: build, tests, coverage and pack. push is
  #false, so nothing is published even on the default branch.
  test:
    needs: [versioning]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./
        id: action
        with:
          checkout: false
          version: ${{ needs.versioning.outputs.version }}
          solution-name: tests/fixtures/Fixture.slnx
          dotnet-test-args: '["--minimum-expected-tests", "4"]'
          code-coverage: false
          pack: true
          push: false

      - name: assert packages
        env:
          PACKAGE_COUNT: ${{ steps.action.outputs.package-count }}
        run: |
          set -euo pipefail
          ls -1 "$RUNNER_TEMP/nupkg"
          test "$PACKAGE_COUNT" = 1
          compgen -G "$RUNNER_TEMP/nupkg/Fixture.Package.*.snupkg" > /dev/null

  #Reports as validate / readme-ref-check, the required status check name.
  validate:
    needs: [versioning]
    uses: f2calv/gha-workflows/.github/workflows/readme-ref-check.yml@v1
    with:
      major: ${{ needs.versioning.outputs.major }}
    permissions:
      contents: read
  release:
    needs: [lint, versioning, test, validate]
    if: needs.versioning.outputs.release-exists == 'false'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: f2calv/gha-workflows/.github/workflows/gha-release-versioning.yml@v1
    with:
      semVer: ${{ format('{0}.{1}.{2}', needs.versioning.outputs.major, needs.versioning.outputs.minor, needs.versioning.outputs.patch) }}
    permissions:
      contents: write
